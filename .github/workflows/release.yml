name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require notarization credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_P12" || -z "$DEVELOPER_ID_P12_PASSWORD" || \
                -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "::error::A required Apple signing/notarization secret is missing. See README.md, Release signing and notarization."
            exit 1
          fi

      - name: Import Developer ID certificate
        id: signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/stash-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$DEVELOPER_ID_P12" | base64 -D > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" \
            -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::The imported certificate is not a valid Developer ID Application identity."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Install DMG packaging tool
        run: brew install create-dmg

      - name: Build arm64 app
        run: |
          set -euo pipefail
          swift build -c release --arch arm64
          BIN_DIR="$(swift build -c release --arch arm64 --show-bin-path)"

          STAGING=".build/Stash.app.staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Contents/MacOS" "$STAGING/Contents/Resources"

          cp "$BIN_DIR/Stash" "$STAGING/Contents/MacOS/Stash"
          cp "Packaging/Info.plist" "$STAGING/Contents/Info.plist"
          cp "Sources/Stash_macOS26_Source/Resources/StashLogo.png" "$STAGING/Contents/Resources/StashLogo.png"
          cp "Packaging/AppIcon.icns" "$STAGING/Contents/Resources/AppIcon.icns"

          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" \
            --identifier com.harry.Stash \
            --requirements '=designated => identifier "com.harry.Stash"' \
            "$STAGING"
          codesign --verify --deep --strict "$STAGING"

          rm -rf Stash.app
          mv "$STAGING" Stash.app
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          file Stash.app/Contents/MacOS/Stash
          test "$(lipo -archs Stash.app/Contents/MacOS/Stash)" = "arm64"
          codesign --verify --deep --strict Stash.app

          ditto -c -k --keepParent Stash.app Stash-notarization.zip
          xcrun notarytool submit Stash-notarization.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple Stash.app
          xcrun stapler validate Stash.app
          spctl --assess --type execute --verbose=4 Stash.app

      - name: Create instructed drag-to-Applications DMG
        run: |
          set -euo pipefail
          ./Packaging/build-dmg.sh
          hdiutil verify "Stash.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" Stash.dmg
          xcrun notarytool submit Stash.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple Stash.dmg
          xcrun stapler validate Stash.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 Stash.dmg
          hdiutil verify Stash.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Stash.dmg \
            --title "Stash $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/stash-signing.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
